name: vistara-postgres

x-s3-environment: &s3-environment
  Media__Storage__Provider: S3
  Media__Storage__S3__Profile: Minio
  Media__Storage__S3__CredentialMode: Static
  Media__Storage__S3__BucketName: vistara
  Media__Storage__S3__Region: us-east-1
  Media__Storage__S3__ServiceUrl: http://minio:9000
  Media__Storage__S3__ForcePathStyle: "true"
  Media__Storage__S3__AllowInsecureHttp: "true"
  Media__Storage__S3__AllowedEndpointHosts__0: minio
  Media__Storage__S3__AccessKeyId: ${VISTARA_S3_ACCESS_KEY:-}
  Media__Storage__S3__SecretAccessKey: ${VISTARA_S3_SECRET_KEY:-}
  Media__Imaging__Provider: NetVips

x-api-auth-environment: &api-auth-environment
  Platform__Authentication__ApiKeys__CurrentPepperVersion: v1
  Platform__Authentication__ApiKeys__Peppers__v1: ${VISTARA_API_PEPPER:-}
  Platform__Authentication__Jwt__Issuers__0__ProfileId: ${VISTARA_OIDC_PROFILE:-local}
  Platform__Authentication__Jwt__Issuers__0__Issuer: ${VISTARA_OIDC_ISSUER:-https://issuer.example.invalid}
  Platform__Authentication__Jwt__Issuers__0__Audience: ${VISTARA_OIDC_AUDIENCE:-vistara-api}
  Platform__Authentication__Jwt__Issuers__0__MetadataAddress: ${VISTARA_OIDC_METADATA_ADDRESS:-https://issuer.example.invalid/.well-known/openid-configuration}
  Platform__Authentication__Jwt__Issuers__0__AllowedAlgorithms__0: RS256

x-app-security: &app-security
  user: "1654:1654"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true

services:
  postgres:
    image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: vistara_bootstrap
      POSTGRES_PASSWORD: ${VISTARA_POSTGRES_BOOTSTRAP_PASSWORD:-}
      POSTGRES_DB: postgres
      VISTARA_MIGRATOR_DB_PASSWORD: ${VISTARA_MIGRATOR_DB_PASSWORD:-}
      VISTARA_API_DB_PASSWORD: ${VISTARA_API_DB_PASSWORD:-}
      VISTARA_WORKER_DB_PASSWORD: ${VISTARA_WORKER_DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-runtime-roles.sh:/docker-entrypoint-initdb.d/10-vistara-roles.sh:ro
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=999,gid=999
      - /var/run/postgresql:size=16m,mode=3770,uid=999,gid=999
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username vistara_migrator --dbname vistara"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      MINIO_ROOT_USER: ${VISTARA_MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${VISTARA_MINIO_ROOT_PASSWORD:-}
    volumes:
      - object-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1770
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/vistara
        mc admin user add local "$$VISTARA_S3_ACCESS_KEY" "$$VISTARA_S3_SECRET_KEY"
        mc admin policy create local vistara-app /config/vistara-policy.json
        mc admin policy attach local vistara-app --user "$$VISTARA_S3_ACCESS_KEY"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${VISTARA_MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${VISTARA_MINIO_ROOT_PASSWORD:-}
      VISTARA_S3_ACCESS_KEY: ${VISTARA_S3_ACCESS_KEY:-}
      VISTARA_S3_SECRET_KEY: ${VISTARA_S3_SECRET_KEY:-}
    tmpfs:
      - /tmp:size=32m,mode=1770
    volumes:
      - ./minio/vistara-policy.json:/config/vistara-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  migrate:
    image: vistara-migrations:${VISTARA_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/containers/migration.Dockerfile
    user: "1654:1654"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      MIGRATION_PROVIDER: PostgreSql
      ConnectionStrings__Vistara: Host=postgres;Port=5432;Database=vistara;Username=vistara_migrator;Password=${VISTARA_MIGRATOR_DB_PASSWORD:-};SSL Mode=Disable;Include Error Detail=false
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=1654,gid=1654,exec
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  api:
    <<: *app-security
    image: vistara-api:${VISTARA_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/containers/api.Dockerfile
    environment:
      <<: [*s3-environment, *api-auth-environment]
      ASPNETCORE_ENVIRONMENT: Production
      Persistence__Provider: PostgreSql
      ConnectionStrings__Vistara: Host=postgres;Port=5432;Database=vistara;Username=vistara_api_runtime;Password=${VISTARA_API_DB_PASSWORD:-};SSL Mode=Disable;Include Error Detail=false
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=1654,gid=1654
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '204' <&3"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  worker:
    <<: *app-security
    image: vistara-worker:${VISTARA_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/containers/worker.Dockerfile
    environment:
      <<: *s3-environment
      DOTNET_ENVIRONMENT: Production
      Persistence__Provider: PostgreSql
      ConnectionStrings__Vistara: Host=postgres;Port=5432;Database=vistara;Username=vistara_worker_runtime;Password=${VISTARA_WORKER_DB_PASSWORD:-};SSL Mode=Disable;Include Error Detail=false
      Worker__InstanceId: postgres-worker
      Worker__Jobs__MaximumConcurrency: "1"
      Worker__ImagingLimits__MaximumConcurrentTransforms: "1"
      Worker__ImagingLimits__ScratchDirectory: /var/lib/vistara/scratch
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=1654,gid=1654
      - /var/lib/vistara/scratch:size=512m,mode=1770,uid=1654,gid=1654
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  proxy:
    image: nginxinc/nginx-unprivileged:1.29.1-alpine3.22@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx/vistara.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp:size=32m,mode=1770,uid=101,gid=101
      - /var/cache/nginx:size=32m,mode=1770,uid=101,gid=101
    ports:
      - "${VISTARA_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [edge, backend]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
  object-data:
