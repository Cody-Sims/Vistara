name: vistara-development

# Docker Compose refuses to load a file that both imports another file with
# `include` and redefines a service that the import already defines
# ("services.api conflicts with imported resource"). Listing the base topology
# and its development overrides as an ordered `path` list merges them inside the
# import instead, so this file stays a single entry point on every Compose
# release that supports `include`.
include:
  - path:
      - compose.postgres.yml
      - compose.development.override.yml
