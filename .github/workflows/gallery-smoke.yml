name: Gallery smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  gallery-smoke:
    name: Gallery smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          # NuGet caching stays disabled until packages.lock.json files are committed.

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install native imaging codecs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvips42

      - name: Install web dependencies
        run: npm --prefix src/Vistara.Web ci

      - name: Install end-to-end dependencies
        run: npm --prefix tests/Vistara.E2E ci

      - name: Install the smoke browser
        run: npm --prefix tests/Vistara.E2E run install:smoke-browser

      - name: Run the gallery smoke workflow
        run: npm --prefix tests/Vistara.E2E run test:smoke

      - name: Upload gallery smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/Vistara.E2E/playwright-report/**
            tests/Vistara.E2E/.artifacts/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
