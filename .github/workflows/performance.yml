name: Performance gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      measurements-run-id:
        description: Workflow run holding the reference-host k6 summaries.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  local-budgets:
    name: Deterministic performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          # NuGet caching stays disabled until packages.lock.json files are committed.

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install native imaging codecs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvips42

      - name: Build the production web bundle
        run: |
          set -euo pipefail
          npm --prefix src/Vistara.Web ci
          npm --prefix src/Vistara.Web run build

      - name: Evaluate deterministic budgets
        run: >-
          dotnet run -c Release --project tests/Vistara.PerformanceTests

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/Vistara.PerformanceTests/artifacts/*.json
          if-no-files-found: warn
          retention-days: 14

  reference-gate:
    name: Reference host release gate
    if: github.event_name == 'workflow_dispatch' && inputs.measurements-run-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          # NuGet caching stays disabled until packages.lock.json files are committed.

      - name: Download reference-host measurements
        env:
          GH_TOKEN: ${{ github.token }}
          MEASUREMENTS_RUN_ID: ${{ inputs.measurements-run-id }}
        run: |
          set -euo pipefail
          mkdir -p tests/Vistara.PerformanceTests/artifacts
          gh run download "$MEASUREMENTS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name reference-host-measurements \
            --dir tests/Vistara.PerformanceTests/artifacts
          for summary in k6-reference-summary.json k6-browser-summary.json; do
            if [[ ! -f "tests/Vistara.PerformanceTests/artifacts/$summary" ]]; then
              echo "::error::The reference measurement $summary is missing."
              exit 1
            fi
          done

      - name: Require every reference budget
        run: >-
          dotnet run -c Release --project tests/Vistara.PerformanceTests --
          --mode evaluate
          --measurements tests/Vistara.PerformanceTests/artifacts/k6-reference-summary.json
          --frontend-observations tests/Vistara.PerformanceTests/artifacts/k6-browser-summary.json
          --require-reference

      - name: Upload release-gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/Vistara.PerformanceTests/artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
