name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - global.json
      - Vistara.slnx
      - Directory.Build.props
      - Directory.Packages.props
      - eng/package.json
      - eng/package-lock.json
      - "src/**/*.csproj"
      - src/Vistara.Web/package.json
      - src/Vistara.Web/package-lock.json
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - global.json
      - Vistara.slnx
      - Directory.Build.props
      - Directory.Packages.props
      - eng/package.json
      - eng/package-lock.json
      - "src/**/*.csproj"
      - src/Vistara.Web/package.json
      - src/Vistara.Web/package-lock.json

permissions:
  contents: read

concurrency:
  group: copilot-setup-steps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            eng/package-lock.json
            src/Vistara.Web/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore Vistara.slnx

      - name: Install repository tooling dependencies
        run: npm --prefix eng ci

      - name: Install web dependencies
        run: npm --prefix src/Vistara.Web ci
