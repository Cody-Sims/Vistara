name: Repository tooling

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/**
      - .shadow/**
      - eng/**
      - AGENTS.md
      - "**/AGENTS.md"
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/**
      - .shadow/**
      - eng/**
      - AGENTS.md
      - "**/AGENTS.md"
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: repository-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: eng/package-lock.json

      - name: Install repository tooling dependencies
        run: npm ci --prefix eng

      - name: Validate Shadow architecture graph
        run: node eng/validate-shadow.mjs

      - name: Validate agent workflows
        run: node eng/validate-agent-workflows.mjs

      - name: Test repository validators
        run: node --test eng/tests/*.test.mjs

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          binary_directory="$RUNNER_TEMP/actionlint"
          mkdir -p "$binary_directory"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$binary_directory" actionlint
          echo "$binary_directory" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: actionlint
