name: Release images

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      namespace: ${{ steps.release.outputs.namespace }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release and target commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must be stable SemVer (for example, v1.2.3)."
            exit 1
          fi

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq --exit-status \
              --arg tag "$RELEASE_TAG" \
              '.immutable == true and .draft == false and .prerelease == false and .tag_name == $tag' \
              >/dev/null

          commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::Release commit $commit is not reachable from main."
            exit 1
          fi

          {
            echo "commit=$commit"
            echo "namespace=${GITHUB_REPOSITORY_OWNER,,}"
            echo "version=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

  build-api:
    name: Build API image
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create API image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ needs.validate-release.outputs.namespace }}/vistara-api
          tags: |
            type=raw,value=${{ needs.validate-release.outputs.version }}
            type=raw,value=${{ needs.validate-release.outputs.commit }}

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/containers/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Attest API image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ needs.validate-release.outputs.namespace }}/vistara-api
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record API digest
        run: echo "API image digest \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  build-worker:
    name: Build Worker image
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Worker image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ needs.validate-release.outputs.namespace }}/vistara-worker
          tags: |
            type=raw,value=${{ needs.validate-release.outputs.version }}
            type=raw,value=${{ needs.validate-release.outputs.commit }}

      - name: Build and push Worker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/containers/worker.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Attest Worker image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ needs.validate-release.outputs.namespace }}/vistara-worker
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record Worker digest
        run: echo "Worker image digest \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  build-migrations:
    name: Build migration bundle image
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create migration image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ needs.validate-release.outputs.namespace }}/vistara-migrations
          tags: |
            type=raw,value=${{ needs.validate-release.outputs.version }}
            type=raw,value=${{ needs.validate-release.outputs.commit }}

      - name: Build and push migration image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/containers/migration.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ needs.validate-release.outputs.version }}
          sbom: true
          provenance: mode=max

      - name: Attest migration image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ needs.validate-release.outputs.namespace }}/vistara-migrations
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record migration digest
        run: echo "Migration image digest \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  summarize:
    name: Summarize image digests
    needs:
      - build-api
      - build-worker
      - build-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Publish digest summary
        run: |
          {
            echo "API: \`${{ needs.build-api.outputs.digest }}\`"
            echo "Worker: \`${{ needs.build-worker.outputs.digest }}\`"
            echo "Migrations: \`${{ needs.build-migrations.outputs.digest }}\`"
            echo ""
            echo "Run the migration image to its completion before rolling the"
            echo "API or worker forward. Rollback guidance: docs/operations/release-runbook.md"
          } >> "$GITHUB_STEP_SUMMARY"
