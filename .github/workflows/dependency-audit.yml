name: Dependency audit

on:
  push:
    branches:
      - main
    paths:
      - Directory.Packages.props
      - "**/package.json"
      - "**/package-lock.json"
      - eng/audit-dependencies.sh
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - Directory.Packages.props
      - "**/package.json"
      - "**/package-lock.json"
      - eng/audit-dependencies.sh
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  audit:
    name: Audit vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          # NuGet caching stays disabled until packages.lock.json files are committed.

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Restore .NET dependencies
        run: dotnet restore Vistara.slnx

      - name: Audit dependencies
        run: ./eng/audit-dependencies.sh
