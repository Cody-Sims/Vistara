<!doctype html>
<html lang="en" data-theme="dark" data-theme-preference="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const root = document.documentElement;
        try {
          const saved = localStorage.getItem('vistara:theme');
          const preference =
            saved === 'dark' || saved === 'light' || saved === 'system'
              ? saved
              : 'system';
          const systemIsDark = matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          const theme =
            preference === 'system'
              ? systemIsDark
                ? 'dark'
                : 'light'
              : preference;
          root.dataset.theme = theme;
          root.dataset.themePreference = preference;
          root.style.colorScheme = theme;
          const stored = JSON.parse(
            localStorage.getItem('vistara:preferences') || '{}',
          );
          root.dataset.density =
            stored.density === 'compact' ? 'compact' : 'comfortable';
          root.dataset.reducedMotion = String(stored.reducedMotion === true);
          root.dataset.pagedMode = String(
            stored.screenReaderPagedMode === true,
          );
        } catch {
          root.dataset.theme = 'dark';
          root.dataset.themePreference = 'system';
          root.style.colorScheme = 'dark';
          root.dataset.density = 'comfortable';
          root.dataset.reducedMotion = 'false';
          root.dataset.pagedMode = 'false';
        }
      })();
    </script>
    <meta name="theme-color" content="#11110f" />
    <meta
      name="description"
      content="Vistara, a self-hosted image control plane and gallery."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vistara" />
    <meta property="og:title" content="Vistara" />
    <meta
      property="og:description"
      content="A self-hosted image control plane and responsive gallery. Your originals stay yours."
    />
    <meta property="og:image" content="/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Vistara mark beside a stylised mountain vista at dusk."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Vistara</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
